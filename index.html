<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DFlip with Caching</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link href="./dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="./dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-xs-12">
                <div class="_df_book" id="test_book" height="98vh" backgroundcolor="teal" source="./catalog.pdf"></div>
            </div>
        </div>
    </div>

    <script src="./dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="./dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        // DFlip configuration
        var option_test_book = { 
            annotationClass: "pdf-link-class", 
            openPage: 2 
        };

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Prefetch PDF file
        const prefetchPDF = () => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = './catalog.pdf';
            document.head.appendChild(link);
        };

        // Call prefetch when the page loads
        window.addEventListener('load', prefetchPDF);
    </script>
</body>
</html>
